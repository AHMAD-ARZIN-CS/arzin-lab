# Builds the Hub and publishes it to GitHub Pages on every push to main.
# Result: https://<user>.github.io/arzin-lab/ (open it in Safari, then Share → Add to Home Screen)
name: Deploy Hub

on:
  push:
    branches: [main]
    paths: ['hub/**', 'scenes/**', '.github/workflows/deploy-hub.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
        working-directory: hub
      - run: npm run build
        working-directory: hub
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
